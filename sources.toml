[[source]]
slug = "acre"
org = "Adventures in CRE"
url = "https://adventuresincre.com/events/?ical=1&eventDisplay=list"
mode = "ical"
enabled = false
verification_level = "community"
timezone = "America/Los_Angeles"   # national body; see the timezone note above
# A.CRE's calendar is The Events Calendar (WordPress). Three routes in, and
# only one of them is safe. Checked 2026-08-30:
#
#   ical   `?ical=1&eventDisplay=list` -> 30 VEVENTs with a real LOCATION on
#          each. This is the one we want. `eventDisplay=list` is load-bearing:
#          the bare `?ical=1` follows the page's default view and exports a
#          single event. Blocked only by `mode = "ical"` being unimplemented —
#          `FeedAdapter.fetch` returns a SourceError saying so.
#   rss    2 items. Not a usable feed, unlike haas-alumni's.
#   html   works, and is the trap. It extracts 40 events and leaves `city`
#          empty on all of them, so the geography rules have nothing to filter
#          on and 9 out-of-region events clear the floor: Boca Raton, Columbus,
#          Connecticut, Philadelphia, Long Island. Do not enable it this way.
#
# Yield when it does work will be low and that is expected — of 30 events one
# was in LA and four in California. It is here for the one.

# --- Disabled: blocked, kept for a future retest -----------------------------

[[source]]
slug = "uli-la"
org = "ULI Los Angeles"
url = "PASTE_GOOGLE_ALERTS_RSS_URL_HERE"
mode = "rss"
enabled = false
verification_level = "official"
# la.uli.org 403s every path — plain HTTP, headless Chromium, and real Chrome
# alike, with a Cloudflare challenge that does not clear. Search engines are
# allowlisted; we are not. There is no scrape that gets in.
#
# The way through is a feed ULI cannot block. Create a Google Alert:
#   1. google.com/alerts -> query:  site:la.uli.org/events
#   2. Show options -> Deliver to: RSS feed
#   3. Copy the feed URL into `url` above and set enabled = true
#
# `mode = "rss"` needs no new code — FeedAdapter already handles it, costs no
# tokens, and cannot be blocked. Yield is lower than a scrape and it lags by a
# day or so, which is the price of the only route that works.

[[source]]
slug = "labc"
org = "Los Angeles Business Council"
url = "https://labusinesscouncil.org/events/"
mode = "browser"
enabled = false
verification_level = "community"
# Hard 403 to real headless Chromium as well as to plain HTTP.
