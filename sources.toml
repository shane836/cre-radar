# Southern California commercial real estate & real estate investment event sources.
#
# mode              html | browser | rss | ical
#   html            plain HTTP is enough
#   browser         needs headless Chromium (JS calendar, or the host 403s)
#   rss / ical      structured feed — parsed directly, no model call, no tokens
#
# verification_level  official | trusted_partner | community | unverified
#   Decides who wins when two sources describe the same event. The hosting org's
#   own page outranks an aggregator's write-up of it, which is usually the
#   difference between a registration link and a paywalled news post. See
#   src/cre_radar/persist.py.
#
# timezone          IANA zone used to interpret this source's wall-clock times.
#   Correct for every LA-local source. For the two national bodies (ssa, icsc) it
#   is a default that will be wrong for out-of-region events — a known limitation;
#   the extracted `city` still comes through, and the scorer drops non-SoCal
#   events on geography anyway.
#
# Every enabled URL returned usable content on 2026-08-26. Re-check with
# `uv run cre-radar sources check --browser`.

