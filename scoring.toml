# Relevance rules. This file is the whole scorer — no model, no API, no judgment
# call at runtime. Editing it is how you retune what reaches your digest.
#
# THE READER: a principal and capital allocator. He raises capital, buys assets,
# and operates self-storage in LA. He is NOT a property manager, a small
# landlord, or a building engineer.
#
# That distinction does almost all the work here. The LA calendar is dominated by
# operator education — how to evict a tenant, how to pass a seismic inspection,
# how to get an IREM certification — and none of it is for him. What is for him:
# raising capital, deploying it, and the rooms where other principals are.
#
# An event starts at `base` and accumulates. Every rule that fires is recorded,
# so the digest says *why* something scored what it did.
# Final score is clamped 0-100. CRE_MIN_SCORE (default 55) is the cut line.

base = 30

# --- Who is hosting ----------------------------------------------------------
# The single strongest signal. Principal-and-capital organizations versus
# operator-and-vendor organizations. A social event at NAIOP is worth more than
# a technical session at BOMA, because the room is different.
[org]
"California Self Storage Association" = 34
"Self Storage Association" = 28
"NAIOP SoCal" = 26
"ULI Los Angeles" = 26
"USC Lusk Center for Real Estate" = 26
"AIR CRE" = 20
"Berkeley Real Estate Alumni Association" = 16
# General alumni calendars — mostly wine tastings, reunions and football. Their
# real-estate programming is what's wanted, so the org alone must NOT clear the
# floor: weighted so an event needs a capital or asset-class term to surface.
# (BREAA is weighted higher above because every event it runs is real estate.)
"USC Alumni Association" = 4
"Berkeley Haas Alumni" = 4
"UCLA Anderson Alumni" = 4
"ICSC" = 12
"Central City Association of Los Angeles" = 6
"CREW Los Angeles" = 6
"Connect CRE" = 4
"Bisnow" = 16
"Eventbrite" = 0
"Luma — Los Angeles" = -10
"Luma — PropTech & Hospitality Startups" = -10
# Operator orgs. Their programming is trade education for people who manage
# buildings for a living. Real organizations, wrong reader.
"BOMA Greater Los Angeles" = -42
"IREM Greater Los Angeles" = -42
"Apartment Association of Greater Los Angeles" = -46

