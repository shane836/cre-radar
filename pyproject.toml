[project]
name = "cre-radar"
version = "0.1.0"
description = "Two agents: LA commercial real estate event discovery, and LinkedIn/X post surfacing."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13",
    "feedparser>=6.0",
    "httpx>=0.28",
    "playwright>=1.49",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "resend>=2.5",
    "typer>=0.15",
]

[project.scripts]
cre-radar = "cre_radar.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cre_radar"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: typer's whole API is call-in-default; the rule cannot be satisfied here.
# DTZ011: `date.today()` is deliberate — the digest is dated in local time.
ignore = ["B008", "DTZ011"]
